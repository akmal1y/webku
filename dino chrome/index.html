    <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Dino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h2>Chrome Dino</h2>

    <div class="game-shell">
      <canvas id="game" width="900" height="260"></canvas>

      <div class="controls">
        <button id="jumpBtn">LOMPAT</button>
        <button id="restartBtn">ULANGI</button>
      </div>
    </div>

    <p class="hint">
      Tekan SPACE, tombol lompat, atau sentuh layar.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
